<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Progress</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <div class="date">
      <h2 class="day"></h2>
      <h2 class="month"></h2>
      <h2 class="year"></h2>
    </div>
    <div class="time">
      <h2 class="hour"></h2>
      <h2 class="minute"></h2>
      <h2 class="second"></h2>
      <h2 class="am-pm"></h2>
    </div>
    <h2 class="weekday"></h2>
  </div>

  <div class="bar-container">
    <div class="second-container">
      <span></span>
      <div id="bar">
        <div></div>
      </div>
    </div>

    <div class="minute-container">
      <span></span>
      <div id="minute-bar">
        <div></div>
      </div>
    </div>

    <div class="hour-container">
      <span></span>
      <div id="hour-bar">
        <div></div>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>

</html>
